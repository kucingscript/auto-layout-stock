<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SVG Layout App</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <!-- LEFT SIDEBAR -->
    <aside id="leftPanel" class="panel panel-left">
      <div class="panel-header">
        <div class="panel-title">
          <span class="dot"></span>
          <div>
            <div class="title">SVG Layout</div>
            <div class="subtitle">Local folder → Auto pack → Export 1 page</div>
          </div>
        </div>
        <button id="btnCollapseLeft" class="icon-btn" title="Collapse sidebar">⟨⟨</button>
      </div>

      <div class="panel-body">
        <section class="block">
          <div class="block-title">Canvas Size</div>
          <div class="grid2">
            <label class="field">
              <span>Width (mm)</span>
              <input id="canvasW" type="number" value="500" min="10" step="1" />
            </label>
            <label class="field">
              <span>Height (mm)</span>
              <input id="canvasH" type="number" value="500" min="10" step="1" />
            </label>
          </div>

          <div class="grid2">
            <label class="field">
              <span>Spacing (mm)</span>
              <input id="spacingMm" type="number" value="3" min="0" step="0.1" />
              <small>0.3 cm = 3 mm</small>
            </label>

            <label class="field">
              <span>Margin (mm)</span>
              <input id="marginMm" type="number" value="0" min="0" step="1" />
              <small>Opsional</small>
            </label>
          </div>

          <div class="actions">
            <button id="btnAutoLayout" class="btn btn-primary">Layout Otomatis</button>
            <button id="btnClearCanvas" class="btn">Clear</button>
          </div>

          <div class="hint">
            Zoom: <b>Ctrl + Scroll</b> • Pan: <b>Drag</b> • Reset: <b>Double click</b>
          </div>
        </section>

        <section class="block">
          <div class="block-title">Queue (Antrian)</div>
          <div id="queueList" class="queue"></div>
          <div class="actions">
            <button id="btnDownload" class="btn btn-success" disabled>Download SVG (1 halaman)</button>
          </div>
          <div id="statusBox" class="status"></div>
        </section>
      </div>
    </aside>

    <!-- CANVAS AREA -->
    <main class="canvas-wrap">
      <div class="canvas-toolbar">
        <div class="pill">Canvas preview</div>
        <div class="toolbar-right">
          <div class="pill">Objects: <span id="objCount">0</span></div>
          <div class="pill">Scale: <span id="zoomLabel">100%</span></div>
        </div>
      </div>

      <div id="canvasHost" class="canvas-host">
        <svg id="stage" xmlns="http://www.w3.org/2000/svg">
          <!-- background -->
          <rect id="stageBg" x="0" y="0" width="100%" height="100%" />
          <!-- viewport group (pan/zoom) -->
          <g id="viewport">
            <!-- page -->
            <rect id="pageRect" x="0" y="0" rx="6" ry="6"></rect>
            <!-- placed objects -->
            <g id="placed"></g>
          </g>
        </svg>
      </div>
    </main>

    <!-- BOTTOM PANEL -->
    <section id="bottomPanel" class="panel panel-bottom">
      <div class="panel-header bottom-header">
        <div class="bottom-left">
          <button id="btnCollapseBottom" class="icon-btn" title="Collapse bottom">⟱</button>
          <div class="panel-title-mini">
            <div class="title">Library</div>
            <div class="subtitle">Search & pick SVG items</div>
          </div>
        </div>

        <div class="bottom-right">
          <label class="field inline">
            <span>Category</span>
            <select id="categorySelect"></select>
          </label>

          <label class="field inline">
            <span>Search</span>
            <input id="searchInput" type="text" placeholder="Ketik nama file..." list="suggestions" />
            <datalist id="suggestions"></datalist>
          </label>
        </div>
      </div>

      <div class="panel-body bottom-body">
        <div id="gallery" class="gallery"></div>
      </div>
    </section>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="script.js"></script>
</body>
</html>
